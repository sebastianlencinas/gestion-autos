<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modificar</title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>

    <header>
        <nav>
            <ul>
                <li><a href="../html/consulta.html">Consultar</a></li>
                <li><a href="../html/alta.html">Agregar</a></li>
                <li><a href="../html/modificar.html">Modificar</a></li>
                <li><a href="../html/eliminar.html">Eliminar</a></li>
            </ul>
        </nav>
    </header>

    <h2>Modificar</h2>

    <p id="mensaje" class="mensaje"></p>

    <section class="formulario">
        <form id="form-buscar">
            <label for="id-buscar">Modificar auto por ID:</label>
            <input type="number" id="id-buscar" name="id-buscar" required>

            <button type="submit">Buscar</button>
        </form>
    </section>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Marca</th>
                    <th>Precio</th>
                    <th>Color</th>
                </tr>
            </thead>
            <tbody>
                <!-- Tus filas dinámicas irán aquí -->
            </tbody>
        </table>
    </div>

    <section class="formulario">
        <form id="form-modificar">

            <label for="marca">Marca: </label>
            <input type="text" id="marca" name="marca" minlength="2" maxlength="30" required disabled>

            <label for="precio">Precio: </label>
            <input type="number" id="precio" name="precio"
                    min="1" max="1000000000000" required disabled>

            <label for="color">Color: </label>
            <input type="color" id="color" name="color" required disabled>

            <button type="submit" disabled>Guardar cambios</button>
        </form>
    </section>

    <script src="../js/api.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/modificar.js"></script>
</body>
</html>
